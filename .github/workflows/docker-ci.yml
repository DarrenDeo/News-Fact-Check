name: CI - Docker build

on:
  push:
    branches: [ Dockerize-Version ]
  pull_request:
    branches: [ Dockerize-Version ]
  workflow_dispatch: {}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cek syntax Python pakai Python 3.9 (tanpa install requirements)
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Static Python syntax check
        run: |
          python -m compileall app.py src || python -m compileall app.py

      # Build Docker image (di sini baru install requirements di dalam container)
      - name: Build Docker image
        run: |
          docker build -t news-fact-check .
